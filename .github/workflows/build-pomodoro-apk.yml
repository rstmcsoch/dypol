name: Build Pomodoro APK

on:
  workflow_dispatch:
  push:
    branches: [pomodoro-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-pomodoro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-release-apk
          path: android-pomodoro/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
